<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ferrati · Pedidos de bodega</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222; --surface3:#2a2a2a;
    --border:#2e2e2e; --zA:#f5c842; --zB:#3ecfcf; --rojo:#E3000F;
    --verde:#5ecb8a; --rojo2:#e05a5a; --text:#f0f0f0; --muted:#8a8a8a; --r:10px;
    --safe: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  img{display:block;max-width:100%}

  /* ---------- HEADER ---------- */
  header{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--border)}
  .hrow{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
  .logo{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--rojo);text-transform:uppercase;white-space:nowrap}
  .logo b{color:var(--text);font-weight:400}
  .modo-tag{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:#2a2200;color:var(--zA);border:1px solid #4a3d00}
  .sp{flex:1}
  .buscador{position:relative;flex:1 1 200px;min-width:160px}
  .buscador input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:'Space Mono',monospace;font-size:12px;padding:10px 12px 10px 34px;outline:none}
  .buscador input:focus{border-color:var(--zA)}
  .buscador svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
  .filtros{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .fbtn{padding:7px 13px;border-radius:100px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-family:'Space Mono',monospace;font-size:10.5px;white-space:nowrap;transition:.15s}
  .fbtn.on{background:var(--text);color:#0f0f0f;border-color:var(--text);font-weight:700}

  /* ---------- GRILLA ---------- */
  main{padding:16px 16px 130px;max-width:1400px;margin:0 auto}
  .conteo{font-size:11.5px;color:var(--muted);margin-bottom:12px}
  .conteo b{color:var(--text);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:.15s;position:relative;text-align:left;width:100%;display:block}
  .card:active{transform:scale(.975)}
  .card.pedido{border-color:var(--rojo);box-shadow:0 0 0 1px var(--rojo)}
  .ph{aspect-ratio:4/3;background:#fff;position:relative;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:contain}
  .ph.vacia{background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}
  .ph.vacia span{font-family:'Space Mono',monospace;font-size:9px;color:#555;letter-spacing:.1em}
  .ph.vacia .nofoto-cod{font-size:15px;color:#666;font-weight:700;letter-spacing:0}
  .cbody{padding:9px 10px 11px}
  .ccod{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.02em;line-height:1.2}
  .cnom{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cfoot{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
  .loc{font-family:'Space Mono',monospace;font-size:9.5px;padding:3px 7px;border-radius:4px;letter-spacing:.03em;white-space:nowrap}
  .loc.a{background:#2a2200;color:var(--zA);border:1px solid #4a3d00}
  .loc.b{background:#002828;color:var(--zB);border:1px solid #005555}
  .loc.no{background:#2a0d0d;color:var(--rojo2);border:1px solid #5a2020}
  .puntos{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap}
  .punto{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.28)}
  .badge-n{position:absolute;top:7px;right:7px;background:var(--rojo);color:#fff;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;z-index:2}
  .vacio{text-align:center;color:var(--muted);padding:60px 20px;font-size:13px}

  /* ---------- MODAL ---------- */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:flex-end;justify-content:center}
  .ov.on{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;border:1px solid var(--border);border-bottom:none;padding-bottom:calc(18px + var(--safe))}
  @media(min-width:700px){.ov{align-items:center}.sheet{border-radius:16px;border-bottom:1px solid var(--border)}}
  .shead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 18px;display:flex;align-items:flex-start;gap:12px;z-index:2}
  .shead h2{font-family:'Space Mono',monospace;font-size:19px;font-weight:700;letter-spacing:.02em;word-break:break-all}
  .shead p{font-size:12px;color:var(--muted);margin-top:3px}
  .x{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted);flex-shrink:0;margin-left:auto}
  .sbody{padding:16px 18px}
  .metas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .meta{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);background:var(--surface2);padding:4px 9px;border-radius:4px;text-transform:capitalize}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .col{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:.15s}
  .col.on{border-color:var(--rojo);box-shadow:0 0 0 1px var(--rojo)}
  .cinfo{padding:8px 10px;display:flex;align-items:center;gap:7px}
  .cinfo .punto{width:14px;height:14px;flex-shrink:0}
  .cinfo div{min-width:0}
  .cinfo .cc{font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cinfo .cn{font-size:10px;color:var(--muted)}
  .step{display:flex;align-items:center;border-top:1px solid var(--border)}
  .step button{flex:0 0 40px;height:38px;font-size:17px;color:var(--muted);font-weight:600}
  .step button:active{background:var(--surface3)}
  .step .q{flex:1;text-align:center;font-family:'Space Mono',monospace;font-size:14px;font-weight:700}
  .step .q.z{color:#555}
  .manual{display:flex;gap:8px;align-items:center;margin-top:10px}
  .manual input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Space Mono',monospace;font-size:13px;padding:11px;outline:none;text-transform:uppercase}
  .manual input:focus{border-color:var(--zA)}
  .nota-sf{font-size:11.5px;color:var(--muted);background:#2a0d0d;border:1px solid #5a2020;border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.5}

  /* ---------- BARRA PEDIDO ---------- */
  .barra{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px calc(12px + var(--safe));display:none;gap:10px;align-items:center}
  .barra.on{display:flex}
  .barra .res{flex:1;min-width:0}
  .barra .res .n{font-family:'Space Mono',monospace;font-size:15px;font-weight:700}
  .barra .res .s{font-size:11px;color:var(--muted)}
  .btn{padding:12px 18px;border-radius:var(--r);font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap;text-align:center;display:block}
  .btn.pri{background:var(--rojo);color:#fff}
  .btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn.ok{background:var(--verde);color:#0f2818}
  .btn:active{opacity:.75}

  /* ---------- LISTA PEDIDO ---------- */
  .item{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
  .item:last-child{border-bottom:none}
  .item .mini{width:62px;height:47px;background:#fff;border-radius:6px;overflow:hidden;flex-shrink:0}
  .item .mini img{width:100%;height:100%;object-fit:contain}
  .item .mini.vacia{background:var(--surface3);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:8px;color:#666}
  .item .txt{flex:1;min-width:0}
  .item .txt .c{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;word-break:break-all}
  .item .txt .l{font-size:10.5px;color:var(--muted);margin-top:2px}
  .item .step{border:1px solid var(--border);border-radius:8px;flex-shrink:0}
  .item .step button{flex:0 0 32px;height:32px;font-size:15px}
  .item .step .q{min-width:26px;font-size:12.5px}

  /* ---------- LINK ---------- */
  .linkbox{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px;font-family:'Space Mono',monospace;font-size:10.5px;color:var(--zA);word-break:break-all;line-height:1.6;max-height:110px;overflow-y:auto}
  .acciones{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .aviso{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:12px;padding:11px 13px;background:var(--surface2);border-radius:8px;border-left:2px solid var(--zA)}

  /* ---------- ALISTAR ---------- */
  .prog{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px}
  .prow{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
  .prow .big{font-family:'Space Mono',monospace;font-size:20px;font-weight:700}
  .prow .lbl{font-size:11.5px;color:var(--muted)}
  .pbar{height:5px;background:var(--surface3);border-radius:3px;overflow:hidden}
  .pfill{height:100%;background:var(--verde);width:0;transition:width .3s}
  .zsep{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
  .zsep.top{margin-top:6px}
  .zsep .zb{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.15em;padding:5px 13px;border-radius:5px;text-transform:uppercase}
  .zsep .zb.a{background:#2a2200;color:var(--zA);border:1px solid #4a3d00}
  .zsep .zb.b{background:#002828;color:var(--zB);border:1px solid #005555}
  .zsep .zb.x{background:#2a0d0d;color:var(--rojo2);border:1px solid #5a2020}
  .zsep .ln{flex:1;height:1px;background:var(--border)}
  .zsep .cnt{font-size:11px;color:var(--muted)}

  .pick{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;transition:.2s}
  .pick.listo{opacity:.42}
  .pick.listo .pfoto{filter:grayscale(1)}
  .pick.falta{border-color:#5a2020}
  .pcab{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .pnum{width:26px;height:26px;border-radius:50%;background:var(--surface3);color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .pcod{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;letter-spacing:.02em;flex:1;min-width:0;word-break:break-all}
  .pqty{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;background:var(--rojo);color:#fff;padding:5px 11px;border-radius:100px;white-space:nowrap;flex-shrink:0}
  #pickList{max-width:580px}
  .pfoto{background:#fff;aspect-ratio:3/2;position:relative}
  .pfoto img{width:100%;height:100%;object-fit:contain}
  .pfoto.vacia{background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:16/7}
  .pfoto.vacia .c{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;color:#666;word-break:break-all;text-align:center;padding:0 12px}
  .pfoto.vacia .t{font-family:'Space Mono',monospace;font-size:10px;color:#555;letter-spacing:.1em}
  .pvista{position:absolute;bottom:9px;right:9px;background:rgba(0,0,0,.72);color:#fff;font-family:'Space Mono',monospace;font-size:9.5px;padding:5px 10px;border-radius:100px;letter-spacing:.06em}
  .pcolor{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);font-size:12px}
  .pcolor .punto{width:15px;height:15px}
  .pcolor .cn{color:var(--muted)}

  .pubic{display:flex;align-items:stretch;border-top:1px solid var(--border)}
  .pdatos{flex:1;padding:13px 14px;display:flex;gap:7px;flex-wrap:wrap;align-content:center}
  .dd{flex:1;min-width:64px;background:var(--surface2);border-radius:8px;padding:8px 10px;text-align:center}
  .dd .k{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .dd .v{font-family:'Space Mono',monospace;font-size:19px;font-weight:700;line-height:1.25;margin-top:1px}
  .dd.a .v{color:var(--zA)} .dd.b .v{color:var(--zB)}
  .mapa{padding:13px 14px;border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:4px}
  .mgrid{display:flex;gap:2px}
  .mcol{display:flex;flex-direction:column;gap:2px}
  .mc{width:9px;height:9px;border-radius:1.5px;background:var(--surface3)}
  .mc.hit.a{background:var(--zA);box-shadow:0 0 0 1.5px var(--zA)}
  .mc.hit.b{background:var(--zB);box-shadow:0 0 0 1.5px var(--zB)}
  .mlbl{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:.1em;text-align:center}
  @media(max-width:430px){.pubic{flex-direction:column}.mapa{border-left:none;border-top:1px solid var(--border);align-items:center}}

  .otras{padding:0 14px 12px;font-size:11px;color:var(--muted);line-height:1.5}
  .otras b{color:var(--zA);font-family:'Space Mono',monospace}
  .pacc{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-top:1px solid var(--border)}
  .pacc button{padding:14px 8px;background:var(--surface);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
  .pacc button.on-ok{background:var(--verde);color:#0f2818}
  .pacc button.on-no{background:var(--rojo2);color:#2a0808}

  .final{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 16px;margin:22px 0 10px;text-align:center}
  .final h3{font-family:'Space Mono',monospace;font-size:15px;margin-bottom:6px}
  .final p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:15px}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);background:var(--verde);color:#0f2818;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;padding:11px 20px;border-radius:100px;z-index:200;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none !important}
</style>
</head>
<body>

<!-- ══════════ MODO PEDIR ══════════ -->
<div id="vPedir">
  <header>
    <div class="hrow">
      <div class="logo">FERRATI <b>· pedidos</b></div>
      <span class="modo-tag">Armar pedido</span>
      <div class="sp"></div>
      <div class="buscador">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Referencia o nombre…" autocomplete="off">
      </div>
    </div>
    <div class="filtros" id="filtros"></div>
  </header>
  <main>
    <div class="conteo" id="conteo"></div>
    <div class="grid" id="grid"></div>
    <div class="vacio hide" id="vacio">Sin resultados</div>
  </main>
  <div class="barra" id="barra">
    <div class="res">
      <div class="n" id="barraN">0 refs</div>
      <div class="s" id="barraS">0 unidades</div>
    </div>
    <button class="btn sec" id="btnVer">Ver</button>
    <button class="btn pri" id="btnLink">Generar link</button>
  </div>
</div>

<!-- ══════════ MODO ALISTAR ══════════ -->
<div id="vAlistar" class="hide">
  <header>
    <div class="hrow">
      <div class="logo">FERRATI <b>· bodega</b></div>
      <span class="modo-tag" style="background:#002828;color:#3ecfcf;border-color:#005555">Alistar pedido</span>
    </div>
  </header>
  <div class="prog">
    <div class="prow">
      <span class="big" id="pgN">0/0</span>
      <span class="lbl" id="pgL">referencias alistadas</span>
    </div>
    <div class="pbar"><div class="pfill" id="pgF"></div></div>
  </div>
  <main id="pickList"></main>
</div>

<!-- ══════════ MODALES ══════════ -->
<div class="ov" id="ovModelo"><div class="sheet">
  <div class="shead"><div style="min-width:0"><h2 id="mTit"></h2><p id="mSub"></p></div><button class="x" data-cerrar="ovModelo">✕</button></div>
  <div class="sbody" id="mBody"></div>
</div></div>

<div class="ov" id="ovPedido"><div class="sheet">
  <div class="shead"><div><h2>Pedido</h2><p id="pSub"></p></div><button class="x" data-cerrar="ovPedido">✕</button></div>
  <div class="sbody" id="pBody"></div>
</div></div>

<div class="ov" id="ovLink"><div class="sheet">
  <div class="shead"><div><h2>Link para bodega</h2><p id="lSub"></p></div><button class="x" data-cerrar="ovLink">✕</button></div>
  <div class="sbody" id="lBody"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>

/* ═══════════════ HELPERS ═══════════════ */
function foto(cod, lado){ const k = cod + (lado ? '-34' : ''); return EMBED[k] || (CDN + k + '.jpg'); }
function modeloDe(cod){
  const up = (cod || '').toUpperCase().trim();
  if (COLOR[up]) return COLOR[up].m.cod;
  for (let i = 0; i < CODES.length; i++) if (up === CODES[i] || up.indexOf(CODES[i]) === 0) return CODES[i];
  return up;
}
function ubicDe(cod){ return UBIC[modeloDe(cod)] || []; }
function locTxt(u){ return 'Zona ' + u[0] + ' · Col ' + u[1] + ' · Piso ' + u[2]; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function titulo(m){ return m.nom ? m.nom : m.cod; }
let tmo; function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tmo); tmo = setTimeout(function(){ e.classList.remove('on'); }, 1700); }
function cerrar(id){ document.getElementById(id).classList.remove('on'); }
function abrir(id){ document.getElementById(id).classList.add('on'); }

function chipLoc(cod){
  const u = ubicDe(cod);
  if (!u.length) return '<span class="loc no">SIN UBICAR</span>';
  return u.map(function(x){ return '<span class="loc ' + x[0].toLowerCase() + '">' + x[0] + ' · C' + x[1] + ' · P' + x[2] + '</span>'; }).join('');
}

}

function cant(c){ const i = pedido.find(function(x){ return x.c === c; }); return i ? i.q : 0; }
function setCant(c, q){
  q = Math.max(0, Math.min(999, q));
  const i = pedido.findIndex(function(x){ return x.c === c; });
  if (q === 0){ if (i >= 0) pedido.splice(i, 1); }

      (n ? '<span class="badge-n">' + n + '</span>' : '') + ph +
      '<div class="cbody"><div class="ccod">' + esc(m.cod) + '</div>' +
      (m.nom ? '<div class="cnom">' + esc(m.nom) + '</div>' : '<div class="cnom">' + ((m.colores||[]).length ? (m.colores.length + ' colores') : 'sin catalogar') + '</div>') +
      '<div class="cfoot">' + chipLoc(m.cod) + '</div>' +
      (puntos ? '<div class="puntos">' + puntos + '</div>' : '') +
      '</div></button>';
  }).join('');
}
function pintarBarra(){
  const b = document.getElementById('barra');
  b.classList.toggle('on', pedido.length > 0);
  document.getElementById('barraN').textContent = pedido.length + (pedido.length === 1 ? ' referencia' : ' referencias');
  document.getElementById('barraS').textContent = totalUds() + (totalUds() === 1 ? ' unidad' : ' unidades');
}

/* ═══════════════ MODAL MODELO ═══════════════ */
let modeloAbierto = null;
function abrirModelo(cod){ modeloAbierto = MAPA[cod]; pintarModal(); abrir('ovModelo'); }
function stepper(c){
  const q = cant(c);
  return '<div class="step"><button data-menos="' + esc(c) + '">−</button>' +
         '<span class="q' + (q ? '' : ' z') + '">' + q + '</span>' +
         '<button data-mas="' + esc(c) + '">+</button></div>';
}
function pintarModal(){
  const m = modeloAbierto; if (!m) return;
  document.getElementById('mTit').textContent = titulo(m);
  const u = ubicDe(m.cod);
  document.getElementById('mSub').innerHTML = (m.nom ? 'Ref. ' + esc(m.cod) + ' · ' : '') +
    (u.length ? u.map(locTxt).join('  ·  ') : 'Sin ubicación en bodega');
  const metas = [m.forma, m.mat, m.cat, m.medida].filter(Boolean)
    .map(function(x){ return '<span class="meta">' + esc(x) + '</span>'; }).join('');
  let html = metas ? '<div class="metas">' + metas + '</div>' : '';
  if (m.sinfoto || !(m.colores || []).length){
    html += '<div class="nota-sf">Esta referencia todavía no tiene fotos cargadas. Escribe el color que necesitas y tu colaborador lo buscará en el cajón.</div>' +
      '<div class="manual"><input id="colorManual" placeholder="Color (ej. C1)" maxlength="10">' +
      '<button class="btn pri" id="addManual">Agregar</button></div>';
    const props = pedido.filter(function(p){ return modeloDe(p.c) === m.cod; });
    if (props.length){
      html += '<div style="margin-top:16px">' + props.map(function(p){
        return '<div class="item"><div class="mini vacia">SIN<br>FOTO</div><div class="txt"><div class="c">' +
          esc(p.c) + '</div><div class="l">' + (ubicDe(p.c)[0] ? locTxt(ubicDe(p.c)[0]) : 'sin ubicar') +
          '</div></div>' + stepper(p.c) + '</div>';
      }).join('') + '</div>';
    }
  } else {
    html += '<div class="cols">' + m.colores.map(function(c){
      return '<div class="col' + (cant(c.c) ? ' on' : '') + '">' +
        '<div class="ph">' + imgTag(c.c, false, c.c) + '</div>' +
        '<div class="cinfo"><i class="punto" style="background:' + esc(c.hex) + '"></i>' +
        '<div><div class="cc">' + esc(c.c) + '</div>' + (c.n ? '<div class="cn">' + esc(c.n) + '</div>' : '') + '</div></div>' +
        stepper(c.c) + '</div>';
    }).join('') + '</div>';
  }
  document.getElementById('mBody').innerHTML = html;
}

/* ═══════════════ MODAL PEDIDO ═══════════════ */
function pintarPedido(){
  document.getElementById('pSub').textContent = pedido.length + ' referencias · ' + totalUds() + ' unidades';
  if (!pedido.length){ document.getElementById('pBody').innerHTML = '<div class="vacio">El pedido está vacío</div>'; return; }
  const orden = ruta(pedido.slice());
  document.getElementById('pBody').innerHTML = orden.map(function(it){
    const mod = MAPA[modeloDe(it.c)];
    const mini = (COLOR[it.c] || !mod || !mod.sinfoto)
      ? '<div class="mini">' + imgTag(it.c, false, it.c) + '</div>'
      : '<div class="mini vacia">SIN<br>FOTO</div>';
    return '<div class="item">' + mini + '<div class="txt"><div class="c">' + esc(it.c) + '</div>' +
      '<div class="l">' + (it.u ? locTxt(it.u) : 'sin ubicación') + '</div></div>' + stepper(it.c) + '</div>';
  }).join('') +
  '<div class="acciones"><button class="btn sec" id="vaciar">Vaciar</button>' +
  '<button class="btn pri" id="irLink">Generar link</button></div>';
}

/* ═══════════════ RUTA DE PICKING ═══════════════ */
function ruta(items){
  return items.map(function(it){ return { c: it.c, q: it.q, u: ubicDe(it.c)[0] || null, todas: ubicDe(it.c) }; })
    .sort(function(a, b){
      if (!a.u && !b.u) return a.c.localeCompare(b.c);
      if (!a.u) return 1;
      if (!b.u) return -1;
      if (a.u[0] !== b.u[0]) return a.u[0] < b.u[0] ? -1 : 1;
      if (a.u[1] !== b.u[1]) return a.u[1] - b.u[1];
      return b.u[2] - a.u[2];
    });
}

/* ═══════════════ LINK ═══════════════ */
function codificar(){ return pedido.map(function(i){ return i.c + '.' + i.q; }).join(','); }
function baseURL(){ return location.href.split('#')[0]; }
function linkPedido(){ return baseURL() + '#p=' + encodeURIComponent(codificar()); }
function verLink(){
  if (!pedido.length){ toast('El pedido está vacío'); return; }
  const url = linkPedido();
  const sinU = pedido.filter(function(p){ return !ubicDe(p.c).length; });
  document.getElementById('lSub').textContent = pedido.length + ' referencias · ' + totalUds() + ' unidades';
  document.getElementById('lBody').innerHTML =
    '<div class="linkbox" id="lUrl">' + esc(url) + '</div>' +
    '<div class="acciones"><button class="btn sec" id="copiar">Copiar link</button>' +
    '<button class="btn ok" id="wapp">Enviar por WhatsApp</button></div>' +
    (sinU.length ? '<div class="aviso"><b>' + sinU.length + '</b> referencia(s) del pedido no tienen cajón asignado en la bodega: ' +
      sinU.map(function(p){ return esc(p.c); }).join(', ') + '. Tu colaborador las verá marcadas para buscarlas manualmente.</div>' : '') +
    '<div class="aviso">Al abrir el link, tu colaborador ve las fotos y los cajones en orden de recorrido: Zona A de la columna 1 a la 13, luego Zona B.</div>';
  abrir('ovLink');
}
function mensajeWA(){
  return 'Pedido Ferrati para alistar\n' + pedido.length + ' referencias · ' + totalUds() + ' unidades\n\n' + linkPedido();
}

/* ═══════════════ MODO ALISTAR ═══════════════ */
function leerPedidoURL(){
  const h = location.hash.replace(/^#/, '');
  if (!h) return null;
  const par = new URLSearchParams(h);
  const raw = par.get('p');
  if (!raw) return null;
  const items = raw.split(',').map(function(s){
    const p = s.split('.');
    const c = (p[0] || '').toUpperCase().trim();
    if (!c) return null;
    return { c: c, q: Math.max(1, parseInt(p[1] || '1', 10) || 1) };
  }).filter(Boolean);
  return items.length ? items : null;
}
let PICK = [], claveEstado = '', estado = {};
function pintarMapa(zona, col, piso){
  const z = ZONAS[zona]; if (!z) return '';
  let cols = '';
  for (let c = 1; c <= z.cols; c++){
    let cells = '';
    for (let p = z.pisos; p >= 1; p--){
      const hit = (c === col && p === piso);
      cells += '<i class="mc' + (hit ? ' hit ' + zona.toLowerCase() : '') + '"></i>';
    }
    cols += '<div class="mcol">' + cells + '</div>';
  }
  return '<div class="mapa"><div class="mgrid">' + cols + '</div><div class="mlbl">ZONA ' + zona + '</div></div>';
}
function pintarPick(){
  const cont = document.getElementById('pickList');
  let html = '', zonaActual = null, i = 0;
  const porZona = {};
  PICK.forEach(function(it){ const k = it.u ? it.u[0] : 'X'; (porZona[k] = porZona[k] || []).push(it); });
  ['A','B','X'].forEach(function(z){
    const lote = porZona[z]; if (!lote) return;
    const cls = z === 'X' ? 'x' : z.toLowerCase();
    const et  = z === 'X' ? 'Sin ubicación' : 'Zona ' + z;
    html += '<div class="zsep' + (zonaActual === null ? ' top' : '') + '"><span class="zb ' + cls + '">' + et + '</span>' +
            '<span class="cnt">' + lote.length + ' ref.</span><span class="ln"></span></div>';
    zonaActual = z;
    lote.forEach(function(it){
      i++;
      const st = estado[it.c] || '';
      const info = COLOR[it.c];
      const m = MAPA[modeloDe(it.c)];
      const conFoto = !!info || (m && !m.sinfoto);
      const fotoHTML = conFoto
        ? '<div class="pfoto" data-foto="' + esc(it.c) + '" data-lado="0">' + imgTag(it.c, false, it.c) + '<span class="pvista">FRENTE · tocar para 3/4</span></div>'
        : '<div class="pfoto vacia"><span class="c">' + esc(it.c) + '</span><span class="t">SIN FOTO EN CATÁLOGO</span></div>';
      const colorHTML = info && (info.c.n || info.c.hex)
        ? '<div class="pcolor"><i class="punto" style="background:' + esc(info.c.hex) + '"></i>' +
          '<span>' + esc(info.c.n || 'Color ' + it.c.slice(m ? m.cod.length : 0)) + '</span>' +
          '<span class="cn" style="margin-left:auto">' + esc(m ? m.cod : '') + (m && m.nom ? ' · ' + esc(m.nom) : '') + '</span></div>'
        : '';
      const u = it.u;
      const ubicHTML = u
        ? '<div class="pubic"><div class="pdatos">' +
            '<div class="dd ' + u[0].toLowerCase() + '"><div class="k">Zona</div><div class="v">' + u[0] + '</div></div>' +
            '<div class="dd ' + u[0].toLowerCase() + '"><div class="k">Columna</div><div class="v">' + u[1] + '</div></div>' +
            '<div class="dd ' + u[0].toLowerCase() + '"><div class="k">Piso</div><div class="v">' + u[2] + '</div></div>' +
          '</div>' + pintarMapa(u[0], u[1], u[2]) + '</div>'
        : '<div class="pubic"><div class="pdatos"><div class="dd"><div class="k">Ubicación</div><div class="v" style="font-size:13px;color:#e05a5a">NO REGISTRADA</div></div></div></div>';
      const otras = it.todas && it.todas.length > 1
        ? '<div class="otras">También está en: ' + it.todas.slice(1).map(function(x){ return '<b>' + locTxt(x) + '</b>'; }).join(' · ') + '</div>'
        : '';
      html += '<div class="pick' + (st === 'ok' ? ' listo' : '') + (st === 'no' ? ' falta' : '') + '" data-ref="' + esc(it.c) + '">' +
        '<div class="pcab"><span class="pnum">' + i + '</span><span class="pcod">' + esc(it.c) + '</span>' +
        '<span class="pqty">' + it.q + ' und</span></div>' +
        fotoHTML + colorHTML + ubicHTML + otras +
        '<div class="pacc"><button data-ok="' + esc(it.c) + '" class="' + (st === 'ok' ? 'on-ok' : '') + '">✓ Alistado</button>' +
        '<button data-no="' + esc(it.c) + '" class="' + (st === 'no' ? 'on-no' : '') + '">✕ No estaba</button></div></div>';
    });
  });
  const hechos = PICK.filter(function(it){ return estado[it.c]; }).length;
  html += '<div class="final"><h3>' + (hechos === PICK.length ? 'Pedido completo' : 'Faltan ' + (PICK.length - hechos)) + '</h3>' +
    '<p>Cuando termines, envía el resumen para que quede registro de lo que salió y lo que no.</p>' +
    '<button class="btn ok" id="devolver" style="width:100%">Enviar resumen por WhatsApp</button></div>';
  cont.innerHTML = html;
  document.getElementById('pgN').textContent = hechos + '/' + PICK.length;
  document.getElementById('pgF').style.width = (PICK.length ? (hechos / PICK.length * 100) : 0) + '%';
}
function resumenWA(){
  const ok = PICK.filter(function(i){ return estado[i.c] === 'ok'; });
  const no = PICK.filter(function(i){ return estado[i.c] === 'no'; });
  const pend = PICK.filter(function(i){ return !estado[i.c]; });
  let t = 'Pedido Ferrati · resumen de bodega\nAlistado: ' + ok.length + ' de ' + PICK.length + ' referencias\n';
  if (ok.length) t += '\nALISTADO:\n' + ok.map(function(i){ return '· ' + i.c + ' x' + i.q; }).join('\n');
  if (no.length) t += '\n\nNO ESTABA:\n' + no.map(function(i){ return '· ' + i.c + ' x' + i.q + (i.u ? ' (' + locTxt(i.u) + ')' : ''); }).join('\n');
  if (pend.length) t += '\n\nSIN REVISAR:\n' + pend.map(function(i){ return '· ' + i.c; }).join('\n');
  return t;
}

/* ═══════════════ EVENTOS ═══════════════ */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-cerrar],[data-f],[data-m],[data-menos],[data-mas],[data-ok],[data-no],[data-foto],#btnVer,#btnLink,#copiar,#wapp,#vaciar,#irLink,#addManual,#devolver');
  if (!t){
    if (e.target.classList && e.target.classList.contains('ov')) e.target.classList.remove('on');
    return;
  }
  if (t.dataset.cerrar) return cerrar(t.dataset.cerrar);
  if (t.dataset.f){ filtro = t.dataset.f; pintarFiltros(); pintarGrid(); return; }
  if (t.dataset.m)      return abrirModelo(t.dataset.m);
  if (t.dataset.menos)  return setCant(t.dataset.menos, cant(t.dataset.menos) - 1);
  if (t.dataset.mas)    return setCant(t.dataset.mas, cant(t.dataset.mas) + 1);
  if (t.id === 'btnVer'){ pintarPedido(); return abrir('ovPedido'); }
  if (t.id === 'irLink'){ cerrar('ovPedido'); return verLink(); }
  if (t.id === 'btnLink') return verLink();
  if (t.id === 'vaciar'){ if (confirm('¿Vaciar el pedido?')){ pedido = []; guardar(); pintarBarra(); pintarGrid(); pintarPedido(); cerrar('ovPedido'); } return; }
  if (t.id === 'addManual'){
    const inp = document.getElementById('colorManual');
    const suf = (inp.value || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
    setCant(modeloAbierto.cod + suf, cant(modeloAbierto.cod + suf) + 1);
    inp.value = ''; toast('Agregado'); return;
  }
  if (t.id === 'copiar'){
    const url = linkPedido();
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast('Link copiado'); }, function(){ prompt('Copia el link:', url); });
    else prompt('Copia el link:', url);
    return;
  }
  if (t.id === 'wapp'){ window.open('https://wa.me/?text=' + encodeURIComponent(mensajeWA()), '_blank'); return; }
  if (t.id === 'devolver'){ window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(resumenWA()), '_blank'); return; }
  if (t.dataset.foto){
    const lado = t.dataset.lado === '1' ? 0 : 1;
    t.dataset.lado = lado ? '1' : '0';
    const im = t.querySelector('img');
    if (im) im.src = foto(t.dataset.foto, !!lado);
    const v = t.querySelector('.pvista');
    if (v) v.textContent = (lado ? '3/4 · tocar para frente' : 'FRENTE · tocar para 3/4');
    return;
  }
  if (t.dataset.ok || t.dataset.no){
    const ref = t.dataset.ok || t.dataset.no;
    const val = t.dataset.ok ? 'ok' : 'no';
    estado[ref] = (estado[ref] === val) ? '' : val;
    try { localStorage.setItem(claveEstado, JSON.stringify(estado)); } catch(err){}
    pintarPick();
    return;
  }
});
document.getElementById('q').addEventListener('input', function(e){ busca = e.target.value; pintarGrid(); });

/* ═══════════════ ARRANQUE ═══════════════ */
(function init(){
  const desdeURL = leerPedidoURL();
  if (desdeURL){
    document.getElementById('vPedir').classList.add('hide');
    document.getElementById('vAlistar').classList.remove('hide');
    PICK = ruta(desdeURL);
    claveEstado = 'ferrati_pick_' + codificarLista(desdeURL);
    try { estado = JSON.parse(localStorage.getItem(claveEstado) || '{}'); } catch(e){ estado = {}; }
    document.getElementById('pgL').textContent = 'referencias revisadas · ' +
      desdeURL.reduce(function(s, x){ return s + x.q; }, 0) + ' unidades en total';
    pintarPick();
  } else {
    pintarFiltros(); pintarGrid(); pintarBarra();
  }
})();
function codificarLista(l){
  let h = 0;
  const s = l.map(function(i){ return i.c + '.' + i.q; }).join(',');
  for (let i = 0; i < s.length; i++){ h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return Math.abs(h).toString(36);
}
